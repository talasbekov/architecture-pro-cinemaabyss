name: Build and Push Docker Images  

on:
  push:
    branches: [ main, cinema ]
    paths:
      - 'src/**'
      - '.github/workflows/**'

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Log in to Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push proxy-service
        uses: docker/build-push-action@v4
        with:
          context: ./src/microservices/proxy
          push: true
          tags: ghcr.io/${{ github.repository }}/proxy-service:latest

      - name: Build and push events-service
        uses: docker/build-push-action@v4
        with:
          context: ./src/microservices/events
          push: true
          tags: ghcr.io/${{ github.repository }}/events-service:latest

      - name: Build and push monolith
        uses: docker/build-push-action@v4
        with:
          context: ./src/monolith
          push: true
          tags: ghcr.io/${{ github.repository }}/monolith:latest

      - name: Build and push movies-service
        uses: docker/build-push-action@v4
        with:
          context: ./src/microservices/movies
          push: true
          tags: ghcr.io/${{ github.repository }}/movies-service:latest